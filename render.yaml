services:
  - type: web
    name: my-tutor
    runtime: node
    plan: free
    buildCommand: npm run build && cd backend && npm install --production
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
